# Supply-chain advisory gate (#162).
#
# Scoped to ADVISORIES (+ yanked-crate detection) only — CI invokes exactly
# `cargo deny check advisories`, never the bare `cargo deny check` that would
# also evaluate licenses/bans/sources. Those three categories need curated
# allowlists this project hasn't built yet and are out of scope for "guard
# against known-vulnerable dependencies" — keep this file, and the ignore
# list below, minimal.

[advisories]
# Report an unsound-class advisory (e.g. RUSTSEC-2026-0097/rand,
# RUSTSEC-2026-0190/anyhow) for EVERY resolved version in Cargo.lock, not
# just direct workspace dependencies (the "workspace" default). Without
# this, a transitive-only vulnerable resolution (e.g. the rand 0.9.2 that
# slipped through in an earlier cycle — see #185) is silently excluded.
unsound = "all"
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack": potential key recovery through
    # timing side-channels in the `rsa` crate. No fixed release exists
    # upstream.
    #
    # This workspace never activates it: `rsa` is pulled in ONLY via
    # sqlx's optional `mysql`/`postgres` backends, and this repo's sqlx
    # dependency (root Cargo.toml) enables exactly
    # `["runtime-tokio", "sqlite", "chrono"]` — no mysql/postgres feature.
    # Confirmed outside the resolved build graph entirely (not merely
    # runtime-unreachable):
    #   cargo tree --all-features --target all -i rsa   =>  "nothing to print"
    #
    # Re-verify this ignore (and re-check the advisory) if sqlx's
    # mysql/postgres features are ever enabled for this workspace, or once
    # RUSTSEC-2023-0071 gets a fixed release.
    "RUSTSEC-2023-0071",
    # RUSTSEC-2026-0387 — crypto-bigint timing variability in operations
    # meant to be constant-time; patched only in >= 0.7.6. Our crypto-bigint
    # 0.5.5 arrives solely via web-push 0.11.0 (the latest release) ->
    # jwt-simple -> p256/k256 -> elliptic-curve 0.13, which cannot take 0.7.
    # Exposure: the server signs a VAPID JWT with its private key when it
    # sends a push (daily jobs / staff actions); a client cannot trigger
    # signing on demand nor observe its timing from across the Cloudflare
    # tunnel, so the side channel is not practically reachable.
    # Re-check when web-push / jwt-simple move to elliptic-curve 0.14
    # (`cargo tree -i crypto-bigint`), then drop this ignore. (#389, 2026-10-25)
    "RUSTSEC-2026-0387",
]
